<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaSys - Sistema Escolar</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>✦ EducaSys</h1>
        <p>Sistema de Gerenciamento Escolar</p>
    </header>

    <main>

        <!-- CADASTRO DE TURMAS -->
        <section class="painel">
            <h2>📚 Cadastro de Turmas</h2>

            <form id="form-turma" onsubmit="event.preventDefault(); cadastraTurma();">
                <label for="curso">Nome do curso</label>
                <input type="text" id="curso" placeholder="Ex: Engenharia da Computação" required>

                <label for="professor">Professor responsável</label>
                <input type="text" id="professor" placeholder="Nome do professor" required>

                <button type="submit">Cadastrar Turma</button>
            </form>

            <h3>Turmas cadastradas</h3>
            <select id="turma-aluno" disabled>
                <option value="">Nenhuma turma cadastrada</option>
            </select>
        </section>


        <!-- CADASTRO DE ALUNOS -->
        <section class="painel">
            <h2>👨‍🎓 Cadastro de Alunos</h2>

            <form id="form-aluno" onsubmit="event.preventDefault(); cadastraAluno();">
                <label for="nome-aluno">Nome do aluno</label>
                <input type="text" id="nome-aluno" placeholder="Nome completo" required>

                <label for="turma-aluno-select">Selecione a Turma</label>
                <!-- O select principal de turmas que o JS utiliza -->
                <select id="turma-aluno" disabled>
                    <option value="">Cadastre uma turma primeiro</option>
                </select>

                <label for="nota1">Primeira nota</label>
                <input type="number" id="nota1" min="0" max="10" step="0.1" required>

                <label for="nota2">Segunda nota</label>
                <input type="number" id="nota2" min="0" max="10" step="0.1" required>

                <label for="nota3">Terceira nota</label>
                <input type="number" id="nota3" min="0" max="10" step="0.1" required>

                <button type="submit">Cadastrar Aluno</button>
            </form>
        </section>


        <!-- EXIBIÇÃO DOS ALUNOS -->
        <section class="painel">
            <h2>📋 Alunos Cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Aluno</th>
                            <th>Nota 1</th>
                            <th>Nota 2</th>
                            <th>Nota 3</th>
                            <th>Média</th>
                            <th>Situação</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="lista-alunos">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 EducaSys</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
